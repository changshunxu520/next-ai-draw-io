name: Electron Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v0.4.5)"
        required: true

jobs:
  # Mac and Linux: Build and upload directly (no signing needed)
  build-mac-linux:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Download draw.io static files for offline use
        run: |
          rm -rf public/drawio
          git clone --depth 1 https://github.com/jgraph/drawio.git /tmp/drawio
          mkdir -p public/drawio
          cp -r /tmp/drawio/src/main/webapp/* public/drawio/
          rm -rf public/drawio/WEB-INF
          rm -rf public/drawio/META-INF

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run dist:${{ matrix.platform }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Windows: Build and publish unsigned artifacts
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Download draw.io static files for offline use
        shell: bash
        run: |
          rm -rf public/drawio
          git clone --depth 1 https://github.com/jgraph/drawio.git /tmp/drawio
          mkdir -p public/drawio
          cp -r /tmp/drawio/src/main/webapp/* public/drawio/
          rm -rf public/drawio/WEB-INF
          rm -rf public/drawio/META-INF

      - name: Install dependencies
        run: npm install

      - name: Build Windows app
        run: npm run dist:win:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-unsigned
          path: release/*.exe
          retention-days: 7

      - name: Upload unsigned artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
